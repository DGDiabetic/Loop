name: Build Loop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build Loop
        run: |
          xcodebuild \
            -workspace Loop.xcworkspace \
            -scheme Loop \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
